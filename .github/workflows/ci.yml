name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 测试与生成校验
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: 安装依赖
        run: python -m pip install openpyxl==3.1.5

      - name: 运行单元测试与自检
        run: python -m unittest discover -s tests -t tests -v

      - name: 验证看板生成
        run: python build_dashboard.py --input 家电产品项目_任务数据.xlsx --output 项目看板.html
